name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
        rails:
          - "7.2"
          - "8.0"
          - "8.1"
        include:
          - rails: "7.2"
            gemfile: gemfiles/rails_7_2.gemfile
          - rails: "8.0"
            gemfile: gemfiles/rails_8_0.gemfile
          - rails: "8.1"
            gemfile: gemfiles/rails_8_1.gemfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}

      - name: Run tests
        run: bundle exec rake test
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}

  test-success:
    name: All tests passed
    needs: [test]
    # Always finish this required check, including when a dependency fails or skips.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify required CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
